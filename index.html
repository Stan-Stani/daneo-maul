<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단어 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: handheld-console look. Header (title, cartridge, sound, badges), quest strip, pixel map with RPG text box overlaid, D-pad + A/B below.
   Single deliberate look (night console shell), so colors are fixed rather than theme-switched. */
:root{
  color-scheme:dark;
  --shell:#1E2433; --shell-2:#283044; --edge:#3A4560; --ink:#F1F3F8; --muted:#A5AEC4;
  --box:#FBFAF4; --box-ink:#1F2433; --box-edge:#2B3246; --box-muted:#5A6380; --accent:#F2C94C; --accent-ink:#2A2210;
  --a:#D9544B; --b:#4F7BD6; --got:#FFF6D8; --gotedge:#E0B43A; --seen:#E6ECF8; --seenedge:#9FB3DD; --off:#CCD1DE; --offink:#9AA1B4;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:0 16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.03em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:6px;align-items:center}
.pill{font-family:var(--display);font-size:1rem;background:var(--shell-2);color:var(--muted);border:2px solid var(--edge);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.cartbtn{position:relative;width:44px;height:38px;padding:0;border:2px solid #1B1E2B;border-radius:5px 5px 3px 3px;cursor:pointer;
  background:linear-gradient(#0000 0 7px,var(--cart,#888) 7px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 2px 0 #11141d;transition:transform .12s}
.cartbtn::before{content:"";position:absolute;left:6px;right:6px;top:2px;height:4px;background:repeating-linear-gradient(90deg,#9AA3B5 0 2px,#0000 2px 4px);border-radius:1px}
.cartbtn .cl{position:absolute;left:4px;right:4px;top:10px;bottom:7px;display:flex;align-items:center;justify-content:center;background:#FBFAF4;color:#1F2433;border-radius:2px;font-family:var(--display);font-size:.85rem;line-height:1}
.cartbtn:hover,.cartbtn:focus-visible{transform:translateY(-2px)}
.cartbtn:active{transform:translateY(2px)}
.pill.badge{color:var(--accent)}
.pill[aria-pressed="true"]{color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.quest{font-family:var(--display);font-size:1rem;background:var(--shell-2);border:2px dashed var(--edge);color:var(--ink);border-radius:8px;padding:6px 12px;line-height:1.35;font-variant-numeric:tabular-nums}
.quest.late{border-color:var(--a);color:#FFD7D3}

.screen{position:relative;border:4px solid var(--edge);border-radius:10px;overflow:hidden;background:#000;line-height:0}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}

.dlg{position:absolute;left:6px;right:6px;bottom:6px;line-height:1.45;background:var(--box);color:var(--box-ink);border:3px solid var(--box-edge);border-radius:8px;box-shadow:inset 0 0 0 3px #D9DCE6;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 12px);overflow:auto;box-sizing:border-box}
.who{font-family:var(--display);font-size:.95rem;color:var(--box-muted);letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.who .tag{font-size:.75rem;background:var(--seen);border:1px solid var(--seenedge);color:var(--box-ink);border-radius:999px;padding:0 8px}
.txt{font-family:var(--display);font-size:1.22rem;min-height:1.45em;word-break:keep-all}
.more{align-self:flex-end;font-size:.8rem;color:var(--box-muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{font-family:var(--display);font-size:1.12rem;text-align:left;background:#fff;color:var(--box-ink);border:2px solid var(--box-edge);border-radius:6px;padding:8px 12px;cursor:pointer;word-break:keep-all}
.choice::before{content:"▸ ";color:var(--a);visibility:hidden}
.choice:active{background:#EEF1F8}
.choice.sel{background:var(--got);border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.choice.sel::before{visibility:visible}

.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);line-height:1.3;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1.05rem;padding:6px 14px;border-radius:999px;border:2px solid var(--accent-ink);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}

.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px)}
.dpad button{background:var(--shell-2);border:2px solid var(--edge);color:var(--muted);font-size:1.2rem;cursor:pointer;touch-action:none}
.dpad .u{grid-column:2;grid-row:1;border-radius:10px 10px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:10px 0 0 10px}
.dpad .c{grid-column:2;grid-row:2;background:var(--shell-2)}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 10px 10px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 10px 10px}
.dpad button.on{background:var(--edge);color:var(--ink)}
.ab{display:flex;gap:14px;align-items:flex-end;transform:rotate(-18deg)}
.ab button{width:66px;height:66px;border-radius:50%;font-family:var(--display);font-size:1.5rem;color:#fff;border:3px solid rgba(0,0,0,.35);cursor:pointer;touch-action:none}
.ab .A{background:var(--a);margin-bottom:22px}
.ab .B{background:var(--b)}
.ab button:active{filter:brightness(.85)}
.help{font-size:.88rem;color:var(--muted);text-align:center;line-height:1.6}
.help b{color:var(--ink)}
.help .k{display:inline-block;min-width:1.2em;padding:0 5px;border-radius:4px;background:var(--shell-2);border:1px solid var(--edge);font-family:var(--display);color:var(--accent)}

.panel{position:fixed;inset:0;background:rgba(10,12,20,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{background:var(--box);color:var(--box-ink);border:3px solid var(--box-edge);border-radius:12px;max-width:440px;width:100%;max-height:90%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.legend{font-size:.82rem;color:var(--box-muted);margin:0;line-height:1.5}
.blist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{border:2px solid var(--off);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.bd .w{font-family:var(--display);font-size:1.12rem;word-break:keep-all}
.bd .m{font-size:.72rem;color:var(--box-muted);display:none}
#panel.en .bd .m{display:block}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.qbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--box-edge);background:#fff;color:var(--box-ink);font-family:var(--display);font-size:1rem;cursor:pointer;line-height:1}
#panel.en .qbtn{background:var(--box-edge);color:#fff}
.gloss{position:absolute;left:10px;right:10px;top:8px;z-index:4;line-height:1.45;background:var(--accent);color:var(--accent-ink);border:3px solid var(--box-edge);border-radius:8px;padding:8px 46px 9px 12px;font-size:.95rem;display:flex;flex-direction:column;gap:4px;box-sizing:border-box}
.gloss b{font-family:var(--display);font-weight:400;font-size:1.1rem;margin-right:6px}
.gloss .en{font-size:.78rem;opacity:.8;display:block}
.gloss .q{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent-ink);background:transparent;color:var(--accent-ink);font-family:var(--display);cursor:pointer;line-height:1}
.txt .w{cursor:pointer;border-radius:3px}
.talksheet{height:min(78vh,640px)}
.talklog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;border:2px solid var(--box-edge);border-radius:8px;padding:10px 12px;background:#fff;line-height:1.5}
.tl{display:flex;flex-direction:column;gap:1px}
.tl .tw{font-family:var(--display);font-size:.85rem;color:var(--box-muted)}
.tl .tt{font-family:var(--display);font-size:1.08rem;word-break:keep-all}
.tl-empty{color:var(--box-muted);margin:0}
body.talkopen .gloss{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));z-index:20}
.txt .w.hint{background:rgba(242,201,76,.35);box-shadow:0 0 0 2px rgba(242,201,76,.6);animation:tapPulse 1.3s ease-in-out infinite}
@keyframes tapPulse{50%{background:rgba(242,201,76,.75)}}
.gloss .q.pulse{animation:qPulse 1.2s ease-in-out infinite}
@keyframes qPulse{50%{transform:scale(1.18);box-shadow:0 0 0 4px rgba(31,36,51,.25)}}
.taptip{display:inline-block;margin-left:6px;vertical-align:2px;font-size:.72rem;line-height:1.5;background:var(--box-edge);color:#fff;border-radius:999px;padding:0 8px;font-family:var(--display);pointer-events:none}
@media (prefers-reduced-motion: reduce){.txt .w.hint,.gloss .q.pulse{animation:none}}
.txt .w:active{background:rgba(242,201,76,.45)}
.bd .s{font-size:1.1rem;line-height:1;font-family:var(--display)}
.bd.got{border-color:var(--seenedge);background:var(--seen)}
.bd.perfect{border-color:var(--gotedge);background:var(--got)}
.bd:not(.got):not(.perfect) .w{color:var(--offink)}
.tips{font-size:.9rem;line-height:1.6;margin:0;padding-left:1.1em}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:1.05rem;border-radius:8px;padding:8px 14px;cursor:pointer;border:2px solid var(--box-edge);background:#fff;color:var(--box-ink)}
.btn.primary{background:var(--box-edge);color:#fff}
.btn.warn{border-color:var(--a);color:var(--a)}

/* cartridge select: sits over the game screen so the D-pad and A/B stay reachable */
.cartmenu{position:absolute;inset:0;background:rgba(16,19,30,.94);line-height:1.4;display:flex;flex-direction:column;gap:8px;padding:10px 12px;box-sizing:border-box;overflow:auto;z-index:3}
.cartmenu .ch{font-family:var(--display);font-size:1.3rem;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.cartmenu .x{font-size:1rem;background:transparent;color:var(--muted);border:2px solid var(--edge);border-radius:999px;width:32px;height:32px;cursor:pointer}
.clist{display:flex;flex-direction:column;gap:8px}
.cart{display:flex;gap:12px;align-items:center;text-align:left;background:var(--shell-2);color:var(--ink);border:3px solid var(--edge);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;min-width:0}
.cart.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cart .lab{flex:none;width:42px;height:50px;border-radius:5px 5px 2px 2px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.1rem;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.cart .info{min-width:0;flex:1}
.cart .t{font-family:var(--display);font-size:1.15rem;display:flex;gap:8px;align-items:baseline}
.cart .t small{font-family:var(--body);font-size:.75rem;color:var(--accent)}
.cart .d{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartmenu .hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:auto}
@media (max-width:360px){.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.ab button{width:58px;height:58px}.blist{grid-template-columns:repeat(2,1fr)}h1{font-size:1.25rem}}
@media (prefers-reduced-motion: reduce){.more{animation:none}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>단어 마을</h1>
    <div class="hbtns">
      <button class="cartbtn" id="cartBtn" aria-label="카트리지 바꾸기"><span class="cl">1편</span></button>
      <button class="pill" id="sndBtn" aria-pressed="true" aria-label="소리">♪</button>
      <button class="pill" id="talkBtn" aria-label="대화 기록">대화</button>
      <button class="pill badge" id="badgeBtn">배지 0/0</button>
    </div>
  </header>

  <div class="quest" id="quest" hidden></div>

  <div class="screen" id="screen">
    <canvas id="cv" width="176" height="160"></canvas>
    <div class="dlg" id="dlg" hidden>
      <div class="who"><span id="who"></span><span class="tag" id="tag" hidden>복습</span></div>
      <div class="txt" id="txt"></div>
      <div class="choices" id="choices" hidden></div>
      <div class="more" id="more" hidden>▼</div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="gloss" id="gloss" hidden></div>
    <div class="cartmenu" id="cartPanel" hidden role="dialog" aria-label="카트리지 고르기">
      <div class="ch"><span id="cartTitle">카트리지</span> <button class="x" id="cartClose" aria-label="닫기">✕</button></div>
      <div id="cartList" class="clist"></div>
      <div class="hint">▲▼ 고르기 · A 시작 · B 닫기</div>
    </div>
  </div>

  <div class="pad">
    <div class="dpad" id="dpad">
      <button class="u" data-d="up" aria-label="위">▲</button>
      <button class="l" data-d="left" aria-label="왼쪽">◀</button>
      <span class="c"></span>
      <button class="r" data-d="right" aria-label="오른쪽">▶</button>
      <button class="d" data-d="down" aria-label="아래">▼</button>
    </div>
    <div class="ab">
      <button class="B" id="btnB" aria-label="B 닫기">B</button>
      <button class="A" id="btnA" aria-label="A 말하기">A</button>
    </div>
  </div>
  <div class="help" id="help"></div>
</div>

<div class="panel" id="talkPanel" hidden>
  <div class="sheet talksheet" role="dialog" aria-label="대화 기록">
    <h2>대화 기록 <button class="btn" id="talkClose">닫기</button></h2>
    <div class="talklog" id="talkList"></div>
  </div>
</div>
<div class="panel" id="panel" hidden>
  <div class="sheet">
    <h2>배지 <button class="qbtn" id="enToggle" aria-label="영어로 보기">?</button></h2>
    <p class="legend">★ 한 번에 다 맞혔어요 · ✓ 받았어요 (복습하면 ★) · ☆ 아직이에요</p>
    <div class="blist" id="blist"></div>
    <ul class="tips" id="tips"></ul>
    <div class="row">
      <button class="btn warn" id="resetBtn">처음부터</button>
      <button class="btn primary" id="closePanel">닫기</button>
    </div>
  </div>
</div>

   state.steps++;
   if(state.steps>=LIMIT&&!state.late){state.late=true;toast('반납일이 지났어요! 😱');sfx('no')}
  }

 },

/* ---------- movement ---------- */
const D={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const player={x:0,y:0,dir:'down',moving:false,t:0,fx:0,fy:0,step:0,look:{hair:'#2A2F4A',skin:'#F1C9A5',shirt:'#D9544B',pants:'#2E3548',cap:'#D9544B'}};
let held=null;
const npcAt=(x,y)=>NPCS.find(n=>n.x===x&&n.y===y);
const walkable=(x,y)=>!!(C.legend[at(x,y)]||{}).walk;
const blocked=(x,y)=>!walkable(x,y)||!!npcAt(x,y);
const menuOpen=()=>!$('cartPanel').hidden;
const panelOpen=()=>!$('panel').hidden||menuOpen()||!$('talkPanel').hidden;

function tryMove(){
  if(player.moving||!held||dlg||panelOpen())return;
  player.dir=held;const [dx,dy]=D[held];const nx=player.x+dx,ny=player.y+dy;
  if(blocked(nx,ny))return;
  player.moving=true;player.t=0;player.fx=player.x;player.fy=player.y;player.x=nx;player.y=ny;player.step=player.step===1?2:1;
  if(petOn()){const ox=player.fx,oy=player.fy;pet.fx=pet.x;pet.fy=pet.y;if(ox!==pet.x||oy!==pet.y)pet.dir=ox>pet.x?'right':ox<pet.x?'left':oy>pet.y?'down':'up';pet.x=ox;pet.y=oy}
}
function update(dt,now){
  if(player.moving){player.t+=dt/170;if(player.t>=1){player.t=0;player.moving=false;state.x=player.x;state.y=player.y;state.dir=player.dir;if(C.onStep){C.onStep();updateQuest()}save();tryMove()}}
  else tryMove();
  if(!dlg)NPCS.forEach(n=>{if(n.still)return;if(now>n.turnAt){const ds=['down','left','right',n.home,n.home];n.dir=ds[Math.random()*ds.length|0];n.turnAt=now+2500+Math.random()*3500}});
}
function render(now){
  const px=player.moving?player.fx+(player.x-player.fx)*player.t:player.x;
  const py=player.moving?player.fy+(player.y-player.fy)*player.t:player.y;
  let cx=px*TS+8-VW*TS/2,cy=py*TS+8-VH*TS/2;
  cx=Math.max(0,Math.min(cx,MW*TS-VW*TS));cy=Math.max(0,Math.min(cy,MH*TS-VH*TS));
  cx=Math.round(cx);cy=Math.round(cy);
  const x0=Math.floor(cx/TS),y0=Math.floor(cy/TS);
  for(let y=y0;y<=y0+VH;y++)for(let x=x0;x<=x0+VW;x++)tile(x,y,x*TS-cx,y*TS-cy,now);
  const ents=NPCS.map(n=>({y:n.y,f:()=>{const X=n.x*TS-cx,Y=n.y*TS-cy-2;(n.kind==='dog'?drawDog(n.look,X,Y,n.dir,0):drawChar(n,X,Y,n.dir,0));marker(X,Y,now,status(n))}}));
  const walk=player.moving?(player.t<.5?player.step:0):0;
  if(petOn()){
    if(!pet.on){petReset();pet.on=true}
    const qx=player.moving?pet.fx+(pet.x-pet.fx)*player.t:pet.x,qy=player.moving?pet.fy+(pet.y-pet.fy)*player.t:pet.y;
    ents.push({y:qy-.01,f:()=>drawDog(C.follower.look,Math.round(qx*TS-cx),Math.round(qy*TS-cy-1),pet.dir,walk?3-walk:0,C.follower.hurt&&C.follower.hurt())});
  }else pet.on=false;
  ents.push({y:py,f:()=>drawChar(player,Math.round(px*TS-cx),Math.round(py*TS-cy-2),player.dir,walk)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
}
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;if(C){update(dt,now);render(now)}requestAnimationFrame(loop)}

/* ---------- tap a word: Korean definition, English only behind ? (dictionary in window.LEX, built by build.py) ---------- */
function wordsHTML(t){const esc=x=>x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));return esc(t).replace(/[가-힣]+/g,w=>`<span class="w">${w}</span>`)}
function lexLookup(w){ // word as written → [[lemma,{k,e}],…]; unknown words fall back to the longest known prefix (상대가 → 상대)
  const L=window.LEX||{map:{},defs:{}},hit=l=>L.defs[l]?[l,L.defs[l]]:null;
  let ls=L.map[w];
  if(!ls)for(let n=w.length;n>0&&!ls;n--){const pre=w.slice(0,n); // longest known prefix, also as a verb/adjective stem (강해서 → 강하다)
  const tries=[pre,pre+'다',/[해했]$/.test(pre)?pre.slice(0,-1)+'하다':null].filter(Boolean);
  if(L.map[pre])ls=L.map[pre];else{const t=tries.find(x=>hit(x));if(t)ls=[t]}}
  return (ls||[]).map(hit).filter(Boolean);
}
function hideGloss(){$('gloss').hidden=true}
/* ---------- conversation log: every line shown, scrollable, words tappable like in the dialogue box ---------- */
let talk=[];
function loadTalk(){talk=[];try{talk=JSON.parse(localStorage.getItem(C.save+'-talk')||'[]')}catch(e){}}
function logTalk(who,text){
  if(!text)return;const last=talk[talk.length-1];if(last&&last[0]===who&&last[1]===text)return;
  talk.push([who,text]);if(talk.length>150)talk=talk.slice(-150);
  try{localStorage.setItem(C.save+'-talk',JSON.stringify(talk))}catch(e){}
}
function openTalk(){
  const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('talkList').innerHTML=talk.length?talk.map(([w,t])=>`<div class="tl"><span class="tw">${esc(w)}</span><span class="tt txt">${wordsHTML(t)}</span></div>`).join(''):'<p class="tl-empty">아직 대화가 없어요.</p>';
  $('talkPanel').hidden=false;document.body.classList.add('talkopen');const L=$('talkList');L.scrollTop=L.scrollHeight;
}

/* Until the player has tapped a word once, the longest word with a definition pulses with a small "눌러 보세요" tag. */
function tapHint(el){
  if(explained.tapWord)return;
  const w=[...el.querySelectorAll('.w')].filter(x=>lexLookup(x.textContent).length).sort((a,b)=>b.textContent.length-a.textContent.length)[0];
  if(!w)return;w.classList.add('hint');w.insertAdjacentHTML('afterend','<span class="taptip">눌러 보세요</span>');
}
function showWord(w){
  if(firstTime('tapWord'))document.querySelectorAll('.taptip').forEach(x=>x.remove()),document.querySelectorAll('.w.hint').forEach(x=>x.classList.remove('hint'));
  const rows=lexLookup(w);if(!rows.length){hideGloss();toast('사전에 없는 말이에요.');return}
  const el=$('gloss');
  el.innerHTML=rows.map(([h,d])=>`<div><b>${h}</b>${d.k}<span class="en" hidden>${d.e||''}</span></div>`).join('')+'<button class="q" type="button" aria-label="영어로 보기">?</button>';
  el.hidden=false;
  if(!explained.tapEnglish)el.querySelector('.q').classList.add('pulse'); // until the player has tried ? once
  el.querySelector('.q').addEventListener('click',e=>{e.stopPropagation();if(firstTime('tapEnglish'))e.currentTarget.classList.remove('pulse');el.querySelectorAll('.en').forEach(x=>x.hidden=!x.hidden);clearTimeout(showWord.t);showWord.t=setTimeout(hideGloss,8000)});
  clearTimeout(showWord.t);showWord.t=setTimeout(hideGloss,6000);
}
function typeText(text,done){
  clearInterval(typing?.id);const el=$('txt');el.textContent='';let i=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  typing={text,done,id:null,finished:false};
  const fin=()=>{clearInterval(typing.id);el.innerHTML=wordsHTML(text);tapHint(el);typing.finished=true;done()};
  typing.fin=fin;
  if(reduce)return fin();
  typing.id=setInterval(()=>{i++;el.textContent=text.slice(0,i);if(i>=text.length)fin()},28);
}
const choiceBtns=()=>[...document.querySelectorAll('#choices .choice')];
const choosing=()=>!!dlg&&!$('choices').hidden&&choiceBtns().length>0;
function renderChoices(s){

function markSel(){const bs=choiceBtns();bs.forEach((b,i)=>b.classList.toggle('sel',i===sel));bs[sel]?.focus({preventScroll:true});bs[sel]?.scrollIntoView({block:'nearest'})}
function moveSel(d){const n=choiceBtns().length;if(!n)return;sel=(sel+d+n)%n;markSel();sfx('move')}
function confirmSel(){const b=choiceBtns()[sel];if(b)b.click()}
function choose(s,i){
  const o=s.opts[i];
  if(o[1]){
    sfx('ok');
    if(s.review){
      const all=(s.w?[s.w]:dlg.npc.badge);
      const ws=all.filter(w=>!state.perfect.includes(w));
      let msg;
      if(s.missed){if(ws.length){if(firstTime('reviewMiss'))msg=`아쉬워요! ★는 한 번에 맞혀야 돼요. 다음에 다시 와요. (${ws.join(', ')})`;else setTimeout(()=>toast('다음에 다시!'),250)}}
      else if(ws.length){state.perfect.push(...ws);save();updateHud();setTimeout(()=>{toast('★ 완벽: '+ws.join(', ')+'!');sfx('star')},250);checkPerfectAll();
        if(firstTime('reviewStar')){msg=`★ 한 번에 맞혔어요! "${ws.join('", "')}" 배지가 별이 됐어요.`;
        const n=dlg.npc; if(n&&n.badge.some(b=>!state.perfect.includes(b))) msg+=' 이 사람한테 다른 단어도 있어요. 다시 말해 보세요!';}}
      if(msg)dlg.steps.splice(dlg.i+1,0,{say:msg});
    }
    dlg.next='advance';show({who:s.who,say:'맞아요! '+(s.ask.includes('___')?s.ask.replace('___',o[0]):o[0])});
  }else{

function advance(){

  if(typing&&!typing.finished){typing.fin();return}

let offerNext=false;
function closeDialog(){

const says=a=>(Array.isArray(a)?a:[a]).map(t=>({say:t}));

function review(n){
  const pool=(n.pool||n.talk.filter(s=>s.ask));
  const weak=pool.filter(q=>!(q.w?[q.w]:n.badge).every(w=>state.perfect.includes(w)));
  const from=weak.length?weak:pool;
  const q=from[Math.random()*from.length|0];
  return [...says(n.after),{...q,review:true}];
}
function interact(){
  if(menuOpen()){pickCart(menuSel);return}
  if(!$('panel').hidden)return;
  if(choosing()){confirmSel();return}
  if(dlg){advance();return}
  if(player.moving)return;
  const [dx,dy]=D[player.dir];const tx=player.x+dx,ty=player.y+dy;
  let n=npcAt(tx,ty);
  if(!n&&(C.legend[at(tx,ty)]||{}).over)n=npcAt(tx+dx,ty+dy); // talk across a counter
  if(n){
    if(!n.still){n.dir=OPP[player.dir];n.turnAt=performance.now()+6000}
    let steps=n.script?n.script():null,isReview=false;
    if(!steps){
      if(n.badge&&n.badge.every(has)){steps=review(n);isReview=true}
      else steps=n.talk;
    }
    openDialog(n.name,steps,{npc:n,review:isReview});
    return;
  }
  if(petOn()&&pet.x===tx&&pet.y===ty&&!(pet.x===player.x&&pet.y===player.y)&&C.follower.talk){openDialog(C.follower.name,C.follower.talk());return}
  const key=tx+','+ty;
  if(C.signs&&C.signs[key]){openDialog(C.signs[key][0],says(C.signs[key][1]));return}
  if(C.spots&&C.spots[key]){openDialog('…',says(C.spots[key]));return}
  const th=C.things&&C.things[at(tx,ty)];
  if(th){openDialog('…',typeof th==='function'?th(tx,ty):th);return}
}

/* Each rule is explained once per player (all cartridges), then only the toast shows. */
let explained={};try{explained=JSON.parse(localStorage.getItem('daneo-maul-explained')||'{}')}catch(e){}
function firstTime(k){if(explained[k])return false;explained[k]=1;try{localStorage.setItem('daneo-maul-explained',JSON.stringify(explained))}catch(e){}return true}
function award(words){
  const nw=words.filter(w=>!has(w));if(!nw.length)return;
  state.badges.push(...nw);
  const perfect=dlg&&dlg.miss===0;
  if(perfect)nw.forEach(w=>{if(!state.perfect.includes(w))state.perfect.push(w)});
  save();updateHud();updateQuest();
  toast('배지 획득: '+nw.join(', ')+(perfect?' ★':' ✓'));sfx('badge');
  if(dlg&&firstTime(perfect?'star':'check')){
    const note=perfect?{who:'단어 마을',say:`★ 한 번도 안 틀렸어요! "${nw.join('", "')}" 배지는 별이에요.`}
                      :{who:'단어 마을',say:`✓ 배지를 받았어요. 틀린 문제가 있어서 아직 별은 아니에요. 머리 위에 ? 가 생겼어요. 다시 말하면 복습 문제가 나와요!`};
    dlg.steps.splice(dlg.i+1,0,note);
  }
  if(state.badges.length>=C.words.length&&!state.celebrated){
    state.celebrated=true;save();
    pendingCelebrate=says(C.done);offerNext=true;
  }
  checkPerfectAll();
}
function checkPerfectAll(){
  if(state.perfect.length>=C.words.length&&!state.celebratedPerfect){
    state.celebratedPerfect=true;save();
    pendingCelebrate=(pendingCelebrate||[]).concat(says(C.perfect));
  }
}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}

/* ---------- HUD ---------- */
function updateHud(){$('badgeBtn').textContent=`배지 ${state.badges.length}/${C.words.length} · ★${state.perfect.length}`}
function updateQuest(){
  const q=$('quest');const v=C.quest?C.quest():null;
  q.hidden=!v;q.textContent=v?v.text:'';q.classList.toggle('late',!!(v&&v.late));
}
function updateSound(){$('sndBtn').setAttribute('aria-pressed',soundOn?'true':'false');$('sndBtn').textContent=soundOn?'♪':'♪̸'}
function openPanel(){
  $('blist').innerHTML=C.words.map(([w,m])=>{const got=has(w),pf=state.perfect.includes(w);return `<div class="bd ${pf?'perfect':got?'got':''}"><span class="s">${pf?'★':got?'✓':'☆'}</span><span class="w">${w}</span><span class="m">${m}</span></div>`}).join('');
  $('tips').innerHTML=(C.tips||[]).map(t=>`<li>${t}</li>`).join('');
  $('panel').hidden=false;$('closePanel').focus();
}

/* ---------- saving ---------- */
function fresh(){return {badges:[],perfect:[],seenIntro:false,x:C.start.x,y:C.start.y,dir:C.start.dir,celebrated:false,celebratedPerfect:false,...JSON.parse(JSON.stringify(C.fresh||{}))}}
function save(){try{localStorage.setItem(C.save,JSON.stringify(state))}catch(e){}}
function loadState(){
  state=fresh();
  try{const s=JSON.parse(localStorage.getItem(C.save)||'null');if(s)Object.assign(state,s)}catch(e){}
  if(!Array.isArray(state.perfect))state.perfect=[];
  if(!walkable(state.x,state.y)||npcAt(state.x,state.y)){state.x=C.start.x;state.y=C.start.y}
}

/* ---------- cartridges ---------- */
function boot(id){
  const next=CARTRIDGES.find(c=>c.id===id)||CARTRIDGES[0];
  if(dlg){dlg=null;clearInterval(typing?.id);$('dlg').hidden=true}
  pendingCelebrate=null;held=null;$('panel').hidden=true;$('toast').hidden=true;
  C=next;
  MAP=C.map.map(r=>r.split(''));MW=MAP[0].length;MH=MAP.length;
  NPCS=C.npcs;NPCS.forEach(n=>{n.home=n.home||n.dir;n.turnAt=performance.now()+2000+Math.random()*3000});
  loadState();loadTalk();
  Object.assign(player,{x:state.x,y:state.y,dir:state.dir,moving:false,t:0});petReset();pet.on=false;
  $('cartBtn').innerHTML=`<span class="cl">${C.n}</span>`;$('cartBtn').style.setProperty('--cart',C.color);$('help').innerHTML=C.help||'';
  try{localStorage.setItem('daneo-maul-cart',C.id)}catch(e){}
  updateHud();updateQuest();
  if(!state.seenIntro&&C.intro){state.seenIntro=true;save();openDialog('안내',says(C.intro))}
}
let menuSel=0;
function openMenu(suggest){
  $('toast').hidden=true;
  if(dlg)closeDialog();
  menuSel=typeof suggest==='number'?suggest:Math.max(0,CARTRIDGES.indexOf(C));
  $('cartTitle').textContent=typeof suggest==='number'?'다음 편이 기다려요!':'카트리지';
  $('cartList').innerHTML=CARTRIDGES.map((c,i)=>{
    let got=0;try{got=(JSON.parse(localStorage.getItem(c.save)||'{}').badges||[]).length}catch(e){}
    return `<button class="cart" data-i="${i}"><span class="lab" style="background:${c.color}">${c.n}</span><span class="info"><div class="t">${c.title}${c===C?'<small>지금</small>':''}</div><div class="d">배지 ${got}/${c.words.length} · ${c.words.map(w=>w[0]).join(' · ')}</div></span></button>`}).join('');
  $('cartList').querySelectorAll('.cart').forEach(b=>{
    b.addEventListener('pointerdown',()=>{menuSel=+b.dataset.i;markMenu()});
    b.addEventListener('click',()=>pickCart(+b.dataset.i));
  });
  $('cartPanel').hidden=false;markMenu();
}
function markMenu(){$('cartList').querySelectorAll('.cart').forEach((b,i)=>{b.classList.toggle('sel',i===menuSel);if(i===menuSel)b.focus({preventScroll:true})})}
function moveMenu(d){const n=CARTRIDGES.length;menuSel=(menuSel+d+n)%n;markMenu();sfx('move')}
function closeMenu(){$('cartPanel').hidden=true}
function pickCart(i){closeMenu();const c=CARTRIDGES[i];if(c!==C){boot(c.id);sfx('cart')}}

/* ---------- input ---------- */
function dir(d){ // a D-pad press, wherever the focus is
  if(menuOpen()){moveMenu(d==='up'||d==='left'?-1:1);return true}
  if(choosing()){moveSel(d==='up'||d==='left'?-1:1);return true}
  return false;
}
document.querySelectorAll('.dpad button').forEach(b=>{
  const on=e=>{e.preventDefault();b.classList.add('on');const d=b.dataset.d;if(dir(d))return;held=d;if(dlg)return;tryMove()};
  const off=()=>{b.classList.remove('on');if(held===b.dataset.d)held=null};
  b.addEventListener('pointerdown',e=>{b.setPointerCapture?.(e.pointerId);on(e)});
  b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
$('btnA').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
$('btnB').addEventListener('pointerdown',e=>{e.preventDefault();cancel()});
$('dlg').addEventListener('click',e=>{const w=e.target.closest('.txt .w');if(w){e.stopPropagation();showWord(w.textContent);return}advance()});
$('gloss').addEventListener('click',e=>{if(!e.target.closest('.q'))hideGloss()});
$('enToggle').addEventListener('click',()=>$('panel').classList.toggle('en'));
$('choices').addEventListener('pointerdown',e=>{const b=e.target.closest('.choice');if(b){sel=choiceBtns().indexOf(b);markSel()}});
$('talkBtn').addEventListener('click',openTalk);$('talkClose').addEventListener('click',closeTalk);
$('talkPanel').addEventListener('click',e=>{if(e.target.id==='talkPanel'){closeTalk();return}const w=e.target.closest('.w');if(w)showWord(w.textContent)});
$('badgeBtn').addEventListener('click',openPanel);
$('cartBtn').addEventListener('click',openMenu);
$('cartClose').addEventListener('click',closeMenu);
$('cartPanel').addEventListener('click',e=>{if(e.target.id==='cartPanel')closeMenu()});
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('daneo-maul-sound',soundOn?'1':'0')}catch(e){}updateSound();sfx('ok')});
$('closePanel').addEventListener('click',()=>$('panel').hidden=true);
$('panel').addEventListener('click',e=>{if(e.target.id==='panel')$('panel').hidden=true});
$('resetBtn').addEventListener('click',()=>{state=fresh();state.seenIntro=true;Object.assign(player,{x:state.x,y:state.y,dir:state.dir,moving:false});petReset();pet.on=false;save();updateHud();updateQuest();$('panel').hidden=true;toast('처음부터 시작해요!')});
document.addEventListener('contextmenu',e=>e.preventDefault());
/* stop the phone's long-press gesture (the delayed buzz) on the controls; pointer events still fire */
document.querySelector('.pad').addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
  if(KEYS[e.key]){e.preventDefault();if(dir(KEYS[e.key]))return;held=KEYS[e.key];return}
  if(choosing()&&/^[1-4]$/.test(e.key)){const b=choiceBtns()[+e.key-1];if(b){e.preventDefault();b.click()}return}
  if([' ','Enter','z','Z'].includes(e.key)){e.preventDefault();if(!e.repeat)interact();return}
  if(['x','X','Escape'].includes(e.key)){e.preventDefault();cancel()}
});
addEventListener('keyup',e=>{if(KEYS[e.key]===held)held=null});

/* ---------- start: newest cartridge ---------- */
updateSound();
let lastCart=null;try{lastCart=localStorage.getItem('daneo-maul-cart')}catch(e){}
boot(CARTRIDGES.some(c=>c.id===lastCart)?lastCart:CARTRIDGES[0].id); // first visit: 1편; after that, the cartridge last played
requestAnimationFrame(loop);
</script>
