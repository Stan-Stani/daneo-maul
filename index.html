<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단어 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: handheld-console look. Header (title, cartridge, sound, badges), quest strip, pixel map with RPG text box overlaid, D-pad + A/B below.
   Single deliberate look (night console shell), so colors are fixed rather than theme-switched. */
:root{
  color-scheme:dark;
  --shell:#1E2433; --shell-2:#283044; --edge:#3A4560; --ink:#F1F3F8; --muted:#A5AEC4;
  --box:#FBFAF4; --box-ink:#1F2433; --box-edge:#2B3246; --box-muted:#5A6380; --accent:#F2C94C; --accent-ink:#2A2210;
  --card:#fff; --a:#D9544B; --b:#4F7BD6; --got:#FFF6D8; --gotedge:#E0B43A; --seen:#E6ECF8; --seenedge:#9FB3DD; --off:#CCD1DE; --offink:#9AA1B4;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}/* dark mode for the dialogue box and sheets: follows the device, and claude.ai's own theme switch */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--box:#262D3F;--card:#30384D;--box-ink:#EEF1F7;--box-edge:#4A5677;--box-muted:#A3ACC4;--got:#3A3320;--gotedge:#C9A13A;--seen:#2B3550;--seenedge:#6E86BD;--off:#333A4C;--offink:#8C93A6}}
:root[data-theme="dark"]{--box:#262D3F;--card:#30384D;--box-ink:#EEF1F7;--box-edge:#4A5677;--box-muted:#A3ACC4;--got:#3A3320;--gotedge:#C9A13A;--seen:#2B3550;--seenedge:#6E86BD;--off:#333A4C;--offink:#8C93A6}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:0 16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.03em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:6px;align-items:center}
.pill{font-family:var(--display);font-size:1rem;background:var(--shell-2);color:var(--muted);border:2px solid var(--edge);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.cartbtn{position:relative;width:44px;height:38px;padding:0;border:2px solid #1B1E2B;border-radius:5px 5px 3px 3px;cursor:pointer;
  background:linear-gradient(#0000 0 7px,var(--cart,#888) 7px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 2px 0 #11141d;transition:transform .12s}
.cartbtn::before{content:"";position:absolute;left:6px;right:6px;top:2px;height:4px;background:repeating-linear-gradient(90deg,#9AA3B5 0 2px,#0000 2px 4px);border-radius:1px}
.cartbtn .cl{position:absolute;left:4px;right:4px;top:10px;bottom:7px;display:flex;align-items:center;justify-content:center;background:#FBFAF4;color:#1F2433;border-radius:2px;font-family:var(--display);font-size:.85rem;line-height:1}
.cartbtn:hover,.cartbtn:focus-visible{transform:translateY(-2px)}
.cartbtn:active{transform:translateY(2px)}
.pill.badge{color:var(--accent)}
@media (max-width:440px){.hbtns{gap:4px}.pill{padding:6px 7px;font-size:.9rem}}
.pill[aria-pressed="true"]{color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.quest{font-family:var(--display);font-size:1rem;background:var(--shell-2);border:2px dashed var(--edge);color:var(--ink);border-radius:8px;padding:6px 12px;line-height:1.35;font-variant-numeric:tabular-nums}
.quest.late{border-color:var(--a);color:#FFD7D3}

.screen{position:relative;border:4px solid var(--edge);border-radius:10px;overflow:hidden;background:#000;line-height:0}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}

.dlg{position:absolute;left:6px;right:6px;bottom:6px;line-height:1.45;background:var(--box);color:var(--box-ink);border:3px solid var(--box-edge);border-radius:8px;box-shadow:inset 0 0 0 3px #D9DCE6;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 12px);overflow:auto;box-sizing:border-box}
.who{font-family:var(--display);font-size:.95rem;color:var(--box-muted);letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.who .tag{font-size:.75rem;background:var(--seen);border:1px solid var(--seenedge);color:var(--box-ink);border-radius:999px;padding:0 8px}
.txt{font-family:var(--display);font-size:1.22rem;min-height:1.45em;word-break:keep-all}
.more{align-self:flex-end;font-size:.8rem;color:var(--box-muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{font-family:var(--display);font-size:1.12rem;text-align:left;background:var(--card);color:var(--box-ink);border:2px solid var(--box-edge);border-radius:6px;padding:8px 12px;cursor:pointer;word-break:keep-all}
.choice::before{content:"▸ ";color:var(--a);visibility:hidden}
.choice:active{background:#EEF1F8}
.choice.sel{background:var(--got);border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.choice.sel::before{visibility:visible}

.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);line-height:1.3;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1.05rem;padding:6px 14px;border-radius:999px;border:2px solid var(--accent-ink);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}

.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px)}
.dpad button{background:var(--shell-2);border:2px solid var(--edge);color:var(--muted);font-size:1.2rem;cursor:pointer;touch-action:none}
.dpad .u{grid-column:2;grid-row:1;border-radius:10px 10px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:10px 0 0 10px}
.dpad .c{grid-column:2;grid-row:2;background:var(--shell-2)}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 10px 10px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 10px 10px}
.dpad button.on{background:var(--edge);color:var(--ink)}
.ab{display:flex;gap:14px;align-items:flex-end;transform:rotate(-18deg)}
.ab button{width:66px;height:66px;border-radius:50%;font-family:var(--display);font-size:1.5rem;color:#fff;border:3px solid rgba(0,0,0,.35);cursor:pointer;touch-action:none}
.ab .A{background:var(--a);margin-bottom:22px}
.ab .B{background:var(--b)}
.ab button:active{filter:brightness(.85)}
.help{font-size:.88rem;color:var(--muted);text-align:center;line-height:1.6}
.help b{color:var(--ink)}
.help .k{display:inline-block;min-width:1.2em;padding:0 5px;border-radius:4px;background:var(--shell-2);border:1px solid var(--edge);font-family:var(--display);color:var(--accent)}

.panel{position:fixed;inset:0;background:rgba(10,12,20,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{background:var(--box);color:var(--box-ink);border:3px solid var(--box-edge);border-radius:12px;max-width:440px;width:100%;max-height:90%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.legend{font-size:.82rem;color:var(--box-muted);margin:0;line-height:1.5}
.blist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{border:2px solid var(--off);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.bd .w{font-family:var(--display);font-size:1.12rem;word-break:keep-all}
.bd .m{font-size:.72rem;color:var(--box-muted);display:none}
#panel.en .bd .m{display:block}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.qbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--box-edge);background:var(--card);color:var(--box-ink);font-family:var(--display);font-size:1rem;cursor:pointer;line-height:1}
#panel.en .qbtn{background:var(--box-edge);color:#fff}
.gloss{position:absolute;left:10px;right:10px;top:8px;z-index:4;line-height:1.45;background:var(--accent);color:var(--accent-ink);border:3px solid var(--box-edge);border-radius:8px;padding:8px 46px 9px 12px;font-size:.95rem;display:flex;flex-direction:column;gap:4px;box-sizing:border-box}
.gloss b{font-family:var(--display);font-weight:400;font-size:1.1rem;margin-right:6px}
.gloss .en{font-size:.78rem;opacity:.8;display:block}
.gloss .q{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent-ink);background:transparent;color:var(--accent-ink);font-family:var(--display);cursor:pointer;line-height:1}
.txt .w{cursor:pointer;border-radius:3px}
.talksheet{height:min(78vh,640px)}
.talklog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;border:2px solid var(--box-edge);border-radius:8px;padding:10px 12px;background:var(--card);line-height:1.5}
.tl{display:flex;flex-direction:column;gap:1px}
.tl .tw{font-family:var(--display);font-size:.85rem;color:var(--box-muted)}
.tl .tt{font-family:var(--display);font-size:1.08rem;word-break:keep-all}
.startrow{display:flex;justify-content:center;padding-top:8px}
.start{font-family:var(--display);font-size:.8rem;letter-spacing:.12em;background:var(--shell-2);color:var(--muted);border:2px solid var(--edge);border-radius:999px;padding:6px 18px;cursor:pointer;transform:rotate(-18deg)}
.start:active{transform:rotate(-18deg) translateY(2px)}
.games{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.games span{font-size:.8rem;opacity:.7;width:100%}.games a{font-weight:700;font-size:.92rem;color:inherit;border:2px dashed currentColor;border-radius:8px;padding:5px 10px;text-decoration:none;opacity:.85}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{font-family:var(--display);font-size:1.1rem;padding:14px 10px;border-radius:10px;border:2px solid var(--box-edge);background:var(--card);color:var(--box-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.mi.wide{grid-column:1/-1}.mi[hidden]{display:none}
.mi.toggle::after{content:' · 꺼짐';opacity:.65}.mi.toggle[aria-pressed="true"]::after{content:' · 켜짐'}
.mi.toggle[aria-pressed="true"]{background:var(--box-edge);color:#fff}
.cartmi .cartbtn{pointer-events:none}
.srclist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.srclist a{color:var(--box-ink);font-family:var(--display);font-size:1.05rem;text-decoration:underline;text-underline-offset:3px}
.srclist small{display:block;color:var(--box-muted);font-size:.8rem;margin-top:2px}
.tapsort{display:flex;gap:6px}.tapsort .btn{padding:4px 12px;font-size:.9rem}.tapsort .btn.on{background:var(--box-edge);color:#fff}
#tapCount{font-size:.9rem;color:var(--box-muted)}
.tp{display:flex;flex-direction:column;gap:2px;cursor:pointer;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.1)}
.tph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.tph b{font-family:var(--display);font-weight:400;font-size:1.2rem}
.tpm{font-size:.78rem;color:var(--box-muted);white-space:nowrap}.tpk{word-break:keep-all}.tpe{font-size:.9rem;color:var(--box-muted)}
.tl-empty{color:var(--box-muted);margin:0}
body.talkopen .gloss{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));z-index:20}
.txt .w.hint{background:rgba(242,201,76,.35);box-shadow:0 0 0 2px rgba(242,201,76,.6);animation:tapPulse 1.3s ease-in-out infinite}
@keyframes tapPulse{50%{background:rgba(242,201,76,.75)}}
.gloss .gx{display:none;position:absolute;right:42px;top:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:inherit;font-size:1.1rem;line-height:1;cursor:pointer}
.gloss.pinned .gx{display:block}.gloss.pinned{padding-right:82px}.gloss.pinned{outline:3px solid rgba(0,0,0,.25);outline-offset:-3px}
.gloss .q.pulse{animation:qPulse 1.2s ease-in-out infinite}
@keyframes qPulse{50%{transform:scale(1.18);box-shadow:0 0 0 4px rgba(31,36,51,.25)}}
.taptip{display:inline-block;margin-left:6px;vertical-align:2px;font-size:.72rem;line-height:1.5;background:var(--box-edge);color:#fff;border-radius:999px;padding:0 8px;font-family:var(--display);pointer-events:none}
@media (prefers-reduced-motion: reduce){.txt .w.hint,.gloss .q.pulse{animation:none}}
.txt .w:active{background:rgba(242,201,76,.45)}
.bd .s{font-size:1.1rem;line-height:1;font-family:var(--display)}
.bd.got{border-color:var(--seenedge);background:var(--seen)}
.bd.perfect{border-color:var(--gotedge);background:var(--got)}
.bd:not(.got):not(.perfect) .w{color:var(--offink)}
.tips{font-size:.9rem;line-height:1.6;margin:0;padding-left:1.1em}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:1.05rem;border-radius:8px;padding:8px 14px;cursor:pointer;border:2px solid var(--box-edge);background:var(--card);color:var(--box-ink)}
.btn.primary{background:var(--box-edge);color:#fff}
.btn.warn{border-color:var(--a);color:var(--a)}

/* cartridge select: sits over the game screen so the D-pad and A/B stay reachable */
.cartmenu{position:absolute;inset:0;background:rgba(16,19,30,.94);line-height:1.4;display:flex;flex-direction:column;gap:8px;padding:10px 12px;box-sizing:border-box;overflow:auto;z-index:3}
.cartmenu .ch{font-family:var(--display);font-size:1.3rem;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.cartmenu .x{font-size:1rem;background:transparent;color:var(--muted);border:2px solid var(--edge);border-radius:999px;width:32px;height:32px;cursor:pointer}
.clist{display:flex;flex-direction:column;gap:8px}
.cart{display:flex;gap:12px;align-items:center;text-align:left;background:var(--shell-2);color:var(--ink);border:3px solid var(--edge);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;min-width:0}
.cart.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cart .lab{flex:none;width:42px;height:50px;border-radius:5px 5px 2px 2px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.1rem;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.cart .info{min-width:0;flex:1}
.cart .t{font-family:var(--display);font-size:1.15rem;display:flex;gap:8px;align-items:baseline}
.cart .t small{font-family:var(--body);font-size:.75rem;color:var(--accent)}
.cart .d{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartmenu .hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:auto}
@media (max-width:360px){.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.ab button{width:58px;height:58px}.blist{grid-template-columns:repeat(2,1fr)}h1{font-size:1.25rem}}
@media (prefers-reduced-motion: reduce){.more{animation:none}}
/* ---------- the shared walk engine's parts (trial port), in 단어 마을's colours ---------- */
.quest:has(#questTxt:empty){display:none}
.help{word-break:keep-all}
.zone,.reg{display:none}  /* one village per cartridge: no room label */
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s;z-index:2}
.fade.on{opacity:1}
.dlg.attop{top:6px;bottom:auto}  /* low on the map the box sits at the top for the whole conversation; toasts and word help move down */
.screen:has(.dlg.attop) .toast{top:auto;bottom:10px}.screen:has(.dlg.attop) .gloss{top:auto;bottom:10px}
.who{justify-content:space-between}
.who>span{display:flex;gap:8px;align-items:center}
.spk{flex:none;width:30px;height:26px;border-radius:6px;border:2px solid var(--box-edge);background:var(--card);color:var(--box-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.spk svg{width:16px;height:16px}
.spk.on{color:var(--a);border-color:var(--a)}
.gl{text-decoration:underline dotted var(--a);text-underline-offset:3px;cursor:help}
.gloss .gx{display:block}.gloss{padding-right:82px}
.gloss .gr{line-height:1.45;word-break:keep-all}
.choice{display:flex;flex-wrap:wrap;gap:0 6px}
.build{display:flex;flex-direction:column;gap:7px}
.slots{display:flex;flex-wrap:wrap;gap:5px;min-height:2.1em;align-items:center;border-bottom:2px dashed var(--box-edge);padding-bottom:6px}
.slots .ph{font-size:.8rem;color:var(--box-muted)}
.slots span.t{font-family:var(--display);font-size:1.12rem;color:var(--a)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{font-family:var(--display);font-size:1.1rem;background:var(--card);color:var(--box-ink);border:2px solid var(--box-edge);border-radius:6px;padding:6px 10px;cursor:pointer}
.tile.sel{background:var(--got);border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.tile.bad{animation:shake .3s}.tile.used{visibility:hidden}
.tile.hint{animation:hint 1.1s ease-in-out infinite;border-color:var(--a)}
@keyframes hint{0%,100%{transform:none}50%{transform:translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ab .A{transition:box-shadow .2s}
.ab .A.ready{box-shadow:0 0 0 4px var(--shell),0 0 0 7px var(--accent)}
/* 배지 (the engine's word journal) */
.sheet h2 small{font-family:var(--body);font-size:.85rem;color:var(--box-muted)}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--box-muted)}
.wlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wd{border:2px solid var(--seenedge);background:var(--seen);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer;min-width:0;color:var(--box-ink)}
.wd .w{font-family:var(--display);font-size:1.12rem;word-break:keep-all}
.wd.off{border-color:var(--off);background:transparent;cursor:default}.wd.off .w{color:var(--offink)}
.wd.sel{border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.pips{display:flex;gap:2px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--off)}
.pips i.on{background:var(--gotedge)}
.pips.due i.on{background:var(--b)}
.card{background:var(--card);color:var(--box-ink);border:2px solid var(--box-edge);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .big{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.card .ex{color:var(--box-muted);font-size:.95rem}
.card .hj{font-size:.85rem;color:var(--box-muted)}
.card .en{font-size:.85rem;color:var(--box-muted)}
.card .enb{align-self:flex-start;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--box-edge);background:var(--card);color:var(--box-ink);font-family:var(--display);cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.items li{font-size:.9rem;background:var(--got);border:1px solid var(--gotedge);border-radius:6px;padding:3px 9px}
.items li.none{background:transparent;border:0;color:var(--box-muted);padding:3px 0}
.btn.warn.armed{background:var(--a);color:#fff}
/* 카트리지 (the engine's chapter list), drawn like the old cartridge menu */
.chlist{display:flex;flex-direction:column;gap:8px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--box-ink);border:2px solid var(--box-edge);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0;font:inherit}
.chap.cur{border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.chap .cn{flex:none;width:42px;height:50px;border-radius:5px 5px 2px 2px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.1rem;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}

 return {id:old.id,n:old.n,title:old.title,color:old.color,save:old.save,words:words.length,place:words.join(' · '),

  migrate:st=>{const F=st.f||(st.f={});st.lv=st.lv||{};
   const fr=old.fresh||{};for(const k in fr)if(st[k]===undefined)st[k]=JSON.parse(JSON.stringify(fr[k]));

   b.forEach(w=>{if(!st.lv[w])st.lv[w]=pf.includes(w)?{b:3,due:now()+GAP[3]}:{b:0,due:now()}});

function makeCartridge(old,words){

 const stem=w=>w.endsWith('다')&&w.length>1?w.slice(0,-1):w;
 const right=q=>(q.opts||[]).filter(o=>o[1]).map(o=>o[0]);
 /* the old engine: an NPC's questions test its badge words. The walk engine wants each question's word: the one it names, else the
    only badge, else the badge its right answer or question contains */
 const wOf=(q,n)=>q.w||(n.badge.length===1?n.badge[0]:n.badge.find(b=>[q.ask,...right(q)].some(t=>String(t).includes(stem(b))))||n.badge[0]);

 for(const n of old.npcs){

  if(n.badge){const pool=(n.pool||talk||[]).filter(s=>s&&s.ask).map(s=>tag(s,n));if(pool.length)Q[n.id]=pool}
  const o=Object.defineProperties({},Object.getOwnPropertyDescriptors(n));  // a fresh copy each boot, getters kept

  const s=lines.find(s=>s.say.includes(stem(w)));if(s)return s.say;

 };

  INTRO:(old.intro||[]).map(say=>({say})),DONE:old.done||[],TIPS:old.tips||[],SOURCES:old.sources||null,
  questText:()=>{const v=quest();return v?v.text:''},

  afterTalk(){

  }};

 const ro=(w=>{const c=w.charCodeAt(w.length-1)-0xAC00,b=c>=0&&c<11172?c%28:0;return b===0||b===8?'로':'으로'})(nx.n);  // 2교시로, 2장으로
 return {steps:[{say:(line?line+' ':'')+nx.n+ro+' 갈까요?',choose:[[nx.n+ro+' 가요',()=>{boot(nx.id);sfx('door')}],['아직이요',null]]}]};
}
function markSel(){const bs=choosing()?choiceBtns():tileBtns();bs.forEach((b,i)=>b.classList.toggle('sel',i===sel));bs[sel]?.focus({preventScroll:true});bs[sel]?.scrollIntoView({block:'nearest'})}
function moveSel(d){if(performance.now()-choicesAt<450)return;  // keys still held from walking don't move a fresh question's selection
 const n=(choosing()?choiceBtns():tileBtns()).length;if(!n)return;sel=sel<0?(d>0?0:n-1):(sel+d+n)%n;markSel();sfx('move')}
let choicesAt=0;
function confirmSel(){if(sel<0||performance.now()-choicesAt<450)return;const b=(choosing()?choiceBtns():tileBtns())[sel];if(b)b.click()}

function renderBuild(s){
 s.got=0;$('build').hidden=false;
 $('slots').innerHTML='<span class="ph">· · ·</span>';
 let order;const solved=o=>[s.build,...(s.alts||[])].some(a=>o.every((v,i)=>s.build[v]===a[i]));
 do order=shuffle(s.build.map((_,i)=>i));while(s.build.length>1&&solved(order));  /* never start already solved (in any right order) */
 $('tiles').innerHTML=order.map(i=>`<button class="tile" data-i="${i}">${s.build[i]}</button>`).join('');
 $('tiles').querySelectorAll('.tile').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();pickTile(s,b)}));
 sel=-1;choicesAt=performance.now();markSel();if(s.hintOK===undefined)s.hintOK=firstTime('tileHint');hintTile(s,4000);
}
/* the very first word-order question a player meets: after a pause its first right tile bobs, a hint without instruction text.
   Never again after that, and never past the first tile: from then on the player knows how tiles work. */
function hintTile(s,ms){
 clearTimeout(hintTile.t);$('tiles').querySelectorAll('.hint').forEach(b=>b.classList.remove('hint'));
 if(!s.hintOK||s.got>0)return;
 hintTile.t=setTimeout(()=>{if(!(dlg&&dlg.cur===s&&building()))return;const seq=s.seq||[],o=[s.build,...(s.alts||[])].find(o=>seq.every((w,j)=>o[j]===w))||s.build;
  [...$('tiles').querySelectorAll('.tile:not(.used)')].find(b=>s.build[+b.dataset.i]===o[seq.length])?.classList.add('hint')},ms);
}
function pickTile(s,b){
 const i=+b.dataset.i,seq=s.seq||(s.seq=[]),t=s.build[i];
 const fits=o=>seq.every((w,j)=>o[j]===w)&&o[seq.length]===t;  // the order so far, plus this tile, is a prefix of a right order
 if(!fits(s.build)&&!(s.alts||[]).some(fits)){sfx('no');s.missed=true;if(s.w)dlg.missed.add(s.w);b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');hintTile(s,1200);return}
 sfx('move');seq.push(t);s.got++;b.classList.add('used');b.classList.remove('sel');hintTile(s,4000);
 if(s.got===1)$('slots').innerHTML='';
 $('slots').insertAdjacentHTML('beforeend',`<span class="t">${s.build[i]}</span>`);
 if(s.got===s.build.length){
  const line=seq.join(' ');sfx('ok');
  if(s.review||dlg.review)gradeStep(s);
  dlg.next='advance';$('build').hidden=true;
  toast(okWord(s));show({who:s.who||dlg.name,say:line+(/[.!?…]$/.test(line)?'':'.')});  // the assembled line is the speaker's own words: praise is a toast
  if(readOn)speak(line);
 }else{sel=-1;markSel()}
}
/* Each rule is explained once per player, then only the toasts speak. */
let explained={};try{explained=JSON.parse(localStorage.getItem(KEY('explained'))||'{}')}catch(e){}
function firstTime(k){if(explained[k])return false;explained[k]=1;try{localStorage.setItem(KEY('explained'),JSON.stringify(explained))}catch(e){}return true}
function gradeStep(s){
 if(!s.w)return;
 const before=lv(s.w).b,b=grade(s.w,!s.missed);
 updateHud();
 if(s.missed)setTimeout(()=>toast(`"${s.w}" 다시 연습해요`),250);
 if(!s.missed&&b>=3&&before<3){setTimeout(()=>{toast('★ '+s.w+' 완벽!');sfx('star')},250)}
 if(s.missed?firstTime('reviewMiss'):firstTime('reviewLevel'))dlg.steps.splice(dlg.i+1,0,{who:LOGNAME,say:s.missed?`"${s.w}" 다시 연습해요. 곧 또 나와요.`:`"${s.w}" 기억 레벨 ${b}/5.`+(b>=3?' ★':'')});
}
/* praise after a right answer: a step's own `ok`, else 맞아! from a friend who speaks 반말 (NPC banmal:1), else 맞아요! */
const okWord=s=>s.ok||(dlg.npc&&dlg.npc.banmal?'맞아!':'맞아요!');
/* the asked line with its blank filled, minus a question after it that the answer has just settled ("…" 맞춤법에 맞는 건?) */
function answered(ask,a){const f=ask.replace('___',a),i=ask.indexOf('___')+a.length;
 const m=f.slice(i).match(/^([^"”]*["”][.!?]?)\s+([^"”]*\?)$/);return m?f.slice(0,i)+m[1]:f}  // only a quoted example's question
function choose(s,i){
 const o=s.opts[i];
 if(o[1]){
  sfx('ok');
  if(s.review||dlg.review)gradeStep(s);
  dlg.next='advance';
  const line=s.done||(s.ask.includes('___')?answered(s.ask,o[0]):o[0]);
  const quiz=/["“][^"”]*___[^"”]*["”]/.test(s.ask)||s.listenOnly;
  if(s.who==='나'&&!s.listenOnly||s.own||s.who==='…'||!quiz){  /* own:1 — the line is the speaker's own words, not a reply to you */
   // the toast is always praise; an ok: that isn't praise ("뭐?", "…") is the other person's reaction, so they say it next
   const react=s.ok&&!/^(맞아|정답|좋아|딩동댕)/.test(s.ok)?s.ok:null;
   toast(react?(dlg.npc&&dlg.npc.banmal?'맞아!':'맞아요!'):okWord(s));show({who:s.who||dlg.name,say:line});
   if(react)dlg.next={who:s.reactWho||dlg.name,say:react}}else show({who:s.who==='나'?dlg.name:s.who,say:okWord(s)+' '+(s.listenOnly?`"${o[0]}"`:line)});
 }else{
  sfx('no');s.missed=true;if(s.w)dlg.missed.add(s.w);
  dlg.next=s;show({who:s.who==='나'?'…':s.who,say:o[2]||'다시 해 봐요.'});  // after your own line, the hint is narration
 }
}
function advance(){
 if(!dlg)return;
 if(typing&&!typing.finished){typing.fin();return}
 if(dlg.cur.ask||dlg.cur.build||dlg.cur.choose)return;
 if(dlg.next){const n=dlg.next;dlg.next=null;if(n!=='advance'){show(n);return}}
 if(dlg.cur.finale){const p=pending;pending=null;closeDialog();finish(p);return}  // a note still waiting (20/20 words!) goes before the ending, not under its fade
 dlg.i++;
 if(dlg.i>=dlg.steps.length){closeDialog();return}
 show(dlg.steps[dlg.i]);
}
let closedAt=0;
function closeDialog(){
 closedAt=performance.now();dlg=null;camT=null;startWalks();clearInterval(typing?.id);$('dlg').hidden=true;$('dlg').classList.remove('attop');closePhone();hideGloss();if(TTS)try{speechSynthesis.cancel()}catch(e){}
 updateQuest();
 if(C.afterTalk)C.afterTalk();  // a chapter's own check after every conversation (단어 마을: the cartridge is complete, every word is ★)
 if(pending){const c=pending;pending=null;setTimeout(()=>{if(!dlg)openDialog(LOGNAME,c)},400)}
}
function cancel(){
 if(phoneOpen){if(!$('gloss').hidden){hideGloss();return}closePhone();return}
 if(CREATOR&&!$('mePanel').hidden){if(me)closeMe(false);return}  // first time: you must pick (no B)
 if(!$('startPanel').hidden){$('startPanel').hidden=true;return}
 if($('repPanel')&&!$('repPanel').hidden){closeReport();return}
 if(!$('tapPanel').hidden){closeTaps();return}
 if(!$('talkPanel').hidden){if(!$('gloss').hidden)hideGloss();else closeTalk();return}
 if(panelOpen()){$('panel').hidden=true;$('chPanel').hidden=true;return}
 if(!$('gloss').hidden){hideGloss();return}
 if(choosing()||building()){speak(dlg.cur.listen||dlg.cur.ask||'');return} // B never throws away a question; it replays it
 if(dlg)closeDialog();
}
const says=a=>(Array.isArray(a)?a:[a]).map(t=>typeof t==='string'?{say:t}:t);  // a line, or a full step (set:, sfx:, …)

function allQuestions(){
 const out=[...(C.BANK||[])];Object.keys(C.Q).forEach(k=>{if(k!=='cafe')out.push(...C.Q[k])});return out;
}
function reviewFor(words){ // pick a question for the weakest of these words
 const ws=[...words].sort((a,b)=>(isDue(b)-isDue(a))||(lv(a).b-lv(b).b));
 const w=ws[0];
 const pool=allQuestions().filter(q=>q.w===w),gen=pool.filter(q=>!q.scene),all=gen.length?gen:pool;  // scene:1 quotes its own scene: never asked in review (it would play the scene before it happens)
 const own=all.filter(q=>!q.gram),qs=own.length?own:all;  // gram:1 tests a pattern, not the word: no star for the word from it
 const narr={review:true,who:'…',ok:'맞아요!'};  /* asked by the narrator: the sentences are generic examples, not in the NPC's voice */
 if(canSpeak()&&soundOn&&listenOn&&Math.random()<.35)return {listen:w,...narr};  // a muted phone (or 듣기 문제 off) can't answer a listening question
 return {...qs[Math.random()*qs.length|0],...narr};
}
function terminal(){
 const due=dueWords();
 if(!state.badges.length)return [{who:TERM.name,say:TERM.empty}];
 if(!due.length){const n=nextDue();return [{who:TERM.name,say:TERM.idle+(n?` ${TERM.next}: ${fmtWait(n-now())} 후.`:'')}]}
 const pick=shuffle(due.slice()).slice(0,4);
 const steps=[{who:TERM.name,say:TERM.due(due.length,pick.length)}];  // due(n,k): n words due, k asked this round (at most 4)
 pick.forEach(w=>steps.push(reviewFor([w])));
 steps.push({who:TERM.name,say:TERM.end});
 return steps;
}
function facing(){
 const [dx,dy]=D[player.dir];const tx=player.x+dx,ty=player.y+dy;
 let n=npcAt(tx,ty);
 if(!n&&(Z.legend[at(tx,ty)]||{}).over)n=npcAt(tx+dx,ty+dy);
 if(n)return {n};
 if(petOn()&&pet.x===tx&&pet.y===ty&&!(pet.x===player.x&&pet.y===player.y))return {pet:1};
 const key=tx+','+ty;
 {const L=Z.legend[at(tx,ty)];if(L&&(L.tile==='terminal'||L.term))return {term:1}}  // the review computer: the 'terminal' tile, or any tile marked term:1 (a laptop, …)
 if(Z.spots&&Z.spots[key])return {spot:Z.spots[key]};
 const w=warpAt(tx,ty);if(w&&w.lock&&w.lock())return {spot:w.lock()};
 /* things: a line for every tile of a kind (Z.things[char] = text | [variants, picked by position] | fn(x,y) → either) */
 const th=Z.things&&Z.things[at(tx,ty)],tv=typeof th==='function'?th(tx,ty):th;
 if(tv)return {spot:Array.isArray(tv)?tv[(tx*7+ty*13)%tv.length]:tv};  // tv may also be {steps:[…]} (a conversation)
 return null;
}
/* {chat:'id'} on someone who is answering another: [opener, answerer] when both are here, so either one plays the whole exchange */
function chatPair(n){
 const L=live(),o=n.chat?C.NPC[n.chat]:L.find(m=>m.chat&&C.NPC[m.chat]===n);
 return o&&L.includes(o)&&!(o.badge&&o.badge.length)?(n.chat?[o,n]:[n,o]):null;
}
/* a conversation with n, as when you press A facing them (also a room's greeting) */
function talkWith(n){
 if(n.proxy){const p=n.proxy();if(p)n=p}
 const pair=chatPair(n);  // two people talking to each other: they keep facing each other, and the one who started speaks first
 if(!pair&&!n.pos&&!sitting(n)&&!n.fixed){n.dir=OPP[player.dir];n.turnAt=performance.now()+6000}  // fixed: furniture (a chair) never turns to face you
 let steps=n.script?n.script():null,isReview=false;
 if(!steps){
  if(n.badge&&n.badge.every(has)){const due=n.badge.some(isDue);steps=due?[...says(n.after),reviewFor(n.badge)]:says(n.after);isReview=due}  // a review question only when one of their words is due
  else steps=n.talk();
 }
 if(pair&&!isReview){const said=m=>(m===n?steps:(m.script&&m.script())||m.talk()).map(s=>s.who?s:{...s,who:m.name,look:m.look});steps=[...said(pair[0]),...said(pair[1])]}
 openDialog(n.name,steps,{npc:n,review:isReview});
}
function interact(){
 if(phoneOpen){if(!$('gloss').hidden){hideGloss();return}if(typing&&!typing.finished){typing.fin();return}closePhone();return}  // A finishes the line, then puts the phone away
 if(!$('gloss').hidden){hideGloss();return}  // A closes the definition first, without advancing
 if(panelOpen())return;
 if(choosing()||building()){confirmSel();return}
 if(dlg){advance();return}
 if(performance.now()-closedAt<650)return;  // the tap that closed a talk, doubled, doesn't reopen it
 if(player.moving||warping)return;
 const F=facing();if(!F)return;
 if(F.n){talkWith(F.n);return}
 if(F.pet){openDialog(C.FOLLOW.name,C.FOLLOW.talk());return}
 if(F.term){openDialog(TERM.name,terminal(),{review:true});return}
 if(F.spot){openDialog('…',F.spot.steps||says(F.spot))}
}

function award(words){
 const nw=words.filter(w=>!has(w));if(!nw.length)return;
 state.badges.push(...nw);
 const perfect=nw.filter(w=>!dlg.missed.has(w));
 nw.forEach(w=>{state.lv[w]=perfect.includes(w)?{b:2,due:now()+GAP[2]}:{b:0,due:now()}});
 save();updateHud();sfx('badge');
 toast('일지에 추가: '+nw.join(', '));
 const note=perfect.length===nw.length
  ?{who:LOGNAME,say:`한 번도 안 틀렸어요! "${nw.join('", "')}" 기억 레벨 2/5.`}
  :{who:LOGNAME,say:`일지에 적었어요. 틀린 단어는 곧 다시 나와요. 머리 위의 ?를 찾아요.`};
 if(firstTime(perfect.length===nw.length?'awardPerfect':'awardMissed'))dlg.steps.splice(dlg.i+1,0,note);
 if(state.badges.length>=C.WORDS.length&&!state.f.allWords){state.f.allWords=1;save();const all=TERM.allWords(C.WORDS.length);if(all&&all.length)pending=says(all)}  // term.allWords(n): the note when the last word is in ([] = none)
}
function finish(pre){
 $('fade').classList.add('on');sfx('star');
 setTimeout(()=>{$('fade').classList.remove('on');const nx=nextChapterAsk('');openDialog('…',(pre||[]).map(s=>({who:LOGNAME,...s})).concat(says(C.DONE),nx.steps||[]))  /* the ending is narration, then: on to the next chapter? */},900);
}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}

/* the header label (room · 교시 title): tighten its letter spacing, then its size, before it would be cut off (…) next to a wide 일지 badge */
function fitReg(){const e=$('reg');if(!e)return;e.style.letterSpacing=e.style.fontSize='';const f0=parseFloat(getComputedStyle(e).fontSize);
 for(const [ls,k] of [['.08em',1],['.03em',1],['.02em',.92],['0',.86]]){if(e.scrollWidth<=e.clientWidth)return;e.style.letterSpacing=ls;e.style.fontSize=k<1?f0*k+'px':''}}

function drawMePreview(){

/* START: everything that isn't the game itself (logs, dictionary, chapters, reading aloud, sound) */
/* 문제 알리기: a report goes to the word-reports inbox on seldoncortex.com. Artifacts can't call other sites, so 보내기 is a
   plain link that carries the report after the # (never in server logs); the page there posts it once and says thanks. */
const REPORT_URL='https://seldoncortex.com/word-reports/';let lastLines=[],repKind='game',lastWord='';
function reportCtx(){
 return {chapter:CH.n+' '+CH.title,place:roomName||Z.name,zone:ZID,pos:player.x+','+player.y,objective:(C.questText&&C.questText())||'',
  line:dlg&&dlg.cur?lastLines[lastLines.length-1]:'',lines:lastLines.join('\n'),word:lastWord}
}
function reportHref(){
 const r={game:G.prefix,kind:repKind,note:$('repNote').value.trim().slice(0,1000),build:CH.id,ctx:reportCtx()};
 const b=new TextEncoder().encode(JSON.stringify(r));let bin='';b.forEach(x=>bin+=String.fromCharCode(x));
 return REPORT_URL+'#'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function openReport(){
 if(!$('repPanel')){
  const P=document.createElement('div');P.className='panel';P.id='repPanel';P.hidden=true;
  P.innerHTML=`<div class="sheet talksheet" role="dialog" aria-label="문제 알리기"><h2><span>문제 알리기</span><button class="btn" id="repClose">닫기</button></h2>
   <div class="row tapsort"><button class="btn" id="repGame">게임이 이상해요</button><button class="btn" id="repKo">한국어가 이상해요</button></div>
   <div id="repCtx" style="font-size:.85rem;opacity:.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0"></div>
   <textarea id="repNote" rows="3" maxlength="1000" placeholder="무엇이 이상해요?" style="width:100%;box-sizing:border-box;font:inherit;padding:8px;border-radius:8px"></textarea>
   <div class="row" style="justify-content:flex-end;margin-top:8px"><a class="btn" id="repSend" target="_blank" rel="noopener" style="text-decoration:none">보내기</a></div></div>`;
  document.body.append(P);
  P.addEventListener('click',e=>{if(e.target===P)closeReport()});$('repClose').addEventListener('click',closeReport);
  $('repGame').addEventListener('click',()=>setRepKind('game'));$('repKo').addEventListener('click',()=>setRepKind('korean'));
  $('repNote').addEventListener('input',()=>{$('repSend').href=reportHref()});
  $('repSend').addEventListener('click',()=>{$('repSend').href=reportHref();setTimeout(()=>{closeReport();$('repNote').value='';toast('고마워요!')},300)});
 }
 const c=reportCtx();$('repCtx').textContent=[c.chapter+' · '+c.place,c.line||lastLines[lastLines.length-1]||'',c.word?'단어: '+c.word:''].filter(Boolean).join('\n');
 setRepKind(repKind);$('repPanel').hidden=false;document.body.classList.add('talkopen');hideGloss();
}
function setRepKind(k){repKind=k;$('repGame').classList.toggle('on',k==='game');$('repKo').classList.toggle('on',k==='korean');$('repSend').href=reportHref()}
function closeReport(){$('repPanel').hidden=true;document.body.classList.remove('talkopen')}
function toggleStart(){const P=$('startPanel');if(P.hidden&&panelOpen())return;P.hidden=!P.hidden;hideGloss()}
{const g=$('startPanel').querySelector('.mgrid'),odd=g.querySelectorAll('.mi:not(.wide)').length%2;  // fill the gap next to a lone item, else a full row
 const b=document.createElement('button');b.className=odd?'mi':'mi wide';b.id='repBtn';b.textContent='문제 알리기';b.addEventListener('click',()=>{$('startPanel').hidden=true;openReport()});$('startPanel').querySelector('.mgrid').append(b)}
$('startBtn').addEventListener('click',toggleStart);$('startClose').addEventListener('click',()=>$('startPanel').hidden=true);
$('startPanel').addEventListener('click',e=>{if(e.target.id==='startPanel'){$('startPanel').hidden=true;return}
 const mi=e.target.closest('.mi');if(mi&&!mi.classList.contains('toggle'))$('startPanel').hidden=true},true);  // capture: close the menu before the item opens its panel
$('tapBtn').addEventListener('click',openTaps);$('tapClose').addEventListener('click',closeTaps);
$('tapSortT').addEventListener('click',()=>{tapSort='t';openTaps()});$('tapSortN').addEventListener('click',()=>{tapSort='n';openTaps()});

/* debug (START → 디버그, saved per game): a 건너뛰기 button on every conversation runs it to the end — right answers, finished word
   orders, every flag / item / word it sets, quietly — and stops at a real decision (a plain choice like "2교시로 갈까요?"). For testing. */
let debugOn=store.get(KEY('debug'))==='1';
function skipTalk(){
 const snd=soundOn;soundOn=false;
 for(let n=0;dlg&&n<500;n++){
  if(typing&&!typing.finished)typing.fin();
  const s=dlg.cur;
  if(s.choose)break;
  if(s.ask&&!dlg.next){choose(s,s.opts.findIndex(o=>o[1]));continue}
  if(s.build&&!dlg.next){for(let i=s.got;i<s.build.length;i++)pickTile(s,$('tiles').querySelector(`.tile[data-i="${i}"]`));continue}
  advance();
 }
 soundOn=snd;if(TTS)try{speechSynthesis.cancel()}catch(e){}
}
(()=>{const grid=document.querySelector('#startPanel .mgrid');if(!grid)return;
 grid.insertAdjacentHTML('beforeend','<button class="mi toggle" id="dbgBtn" aria-pressed="false">디버그</button>');
 $('spk').insertAdjacentHTML('beforebegin','<button class="spk" id="skipBtn" type="button" hidden style="width:auto;padding:0 8px;margin-left:auto;margin-right:6px;font-size:.8rem;font-weight:700">건너뛰기</button>');
 const upd=()=>{$('dbgBtn').setAttribute('aria-pressed',debugOn?'true':'false');$('skipBtn').hidden=!debugOn};upd();
 $('dbgBtn').addEventListener('click',()=>{debugOn=!debugOn;store.set(KEY('debug'),debugOn?'1':'0');upd();sfx('ok');toast(debugOn?'디버그: 대화에 건너뛰기 버튼':'디버그 꺼짐')});
 $('skipBtn').addEventListener('click',e=>{e.stopPropagation();skipTalk()});
})();
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;store.set(KEY('sound'),soundOn?'1':'0');updateSound();sfx('ok')});
if($('listenBtn')){const upd=()=>$('listenBtn').setAttribute('aria-pressed',String(listenOn));upd();  // a game's shell may offer the 듣기 문제 toggle
 $('listenBtn').addEventListener('click',()=>{listenOn=!listenOn;store.set(KEY('listen'),listenOn?'1':'0');upd();sfx('ok');toast(listenOn?'복습에 듣기 문제가 나와요.':'듣기 문제를 껐어요.')})}
$('readBtn').addEventListener('click',()=>{
 if(!canSpeak()){toast('이 기기에는 한국어 음성이 없어요.');return}
 readOn=!readOn;store.set(KEY('read'),readOn?'1':'0');updateRead();toast(readOn?'대사를 소리 내서 읽어요.':'읽기를 껐어요.');if(readOn&&dlg)speak(dlg.cur.say||dlg.cur.ask||'');
});
$('closePanel').addEventListener('click',()=>$('panel').hidden=true);

$('resetBtn').addEventListener('click',()=>{
 const b=$('resetBtn');
 if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='한 번 더 누르면 지워져요';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='처음부터'},3000);return}
 b.classList.remove('armed');b.textContent='처음부터';
 state=fresh();state.seenIntro=true;save();loadZone(state.zone,state.x,state.y,state.dir);updateHud();updateQuest();$('panel').hidden=true;
 setTimeout(()=>openDialog(CH.introWho||G.title||'이야기',C.INTRO),300);  // starting over replays the intro, like a first start
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelector('.pad').addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('textarea,input'))return;  // typing a note, not playing
 if(KEYS[e.key]){e.preventDefault();if(dirPress(KEYS[e.key]))return;held=KEYS[e.key];return}
 if(choosing()&&/^[1-4]$/.test(e.key)){const b=choiceBtns()[+e.key-1];if(b){e.preventDefault();b.click()}return}
 if(building()&&/^[1-9]$/.test(e.key)){const b=[...document.querySelectorAll('#tiles .tile')][+e.key-1];e.preventDefault();if(b&&!b.classList.contains('used'))b.click();return}  // N = the Nth tile where it sits (placed tiles leave a gap)
 if([' ','Enter','z','Z'].includes(e.key)){e.preventDefault();if(!e.repeat)interact();return}
 if(['x','X','Escape'].includes(e.key)){e.preventDefault();cancel();return}
 if(['m','M'].includes(e.key)&&!e.repeat){e.preventDefault();toggleStart()}
});
addEventListener('keyup',e=>{if(KEYS[e.key]===held)held=null});

/* ---------- chapters (each keeps its own save; old chapters are never overwritten) ---------- */
const BASE_TILES={...TILES};
function boot(id){
 CH=CHAPTERS.find(c=>c.id===id)||CHAPTERS[0];
 C=CH.make();
 Object.keys(TILES).forEach(k=>{if(!(k in BASE_TILES))delete TILES[k]});Object.assign(TILES,C.TILES||{});
 player.look=typeof C.PLAYER==='function'?myLook():myLook(C.PLAYER||CREW_LOOK);  // PLAYER as a function = a disguise, drawn at render time // a chapter may put the player in someone else's shoes (5장: Terence)
 if(dlg){dlg=null;clearInterval(typing?.id);$('dlg').hidden=true}
 pending=null;held=null;warping=false;$('panel').hidden=true;$('chPanel').hidden=true;$('toast').hidden=true;logSel=null;
 store.set(KEY('chapter'),CH.id);
 loadState();loadTalk();
 loadZone(state.zone,state.x,state.y,state.dir);
 $('chName').textContent=CH.n;
 updateHud();updateQuest();
 if(G.onBoot)G.onBoot(CH,C);  // the game's own page parts for this chapter (단어 마을: tips, news sources)
 if(!state.seenIntro){state.seenIntro=true;save();const intro=()=>setTimeout(()=>openDialog(CH.introWho||G.title||'이야기',C.INTRO),300);if(me||!CREATOR)intro();else openMe(intro)}  // first time ever: make your character first
 else setTimeout(()=>{if(!dlg&&!panelOpen())greet()},400);  // loaded in a room whose greeting hasn't happened (reloaded mid-scene): it starts over
}
function chapterProgress(c){try{const s=JSON.parse(store.get(c.save)||'null');return s?{got:(s.badges||[]).length,done:!!(s.f&&s.f.done)}:{got:0,done:false}}catch(e){return {got:0,done:false}}}
function openChapters(){
 $('chList').innerHTML=CHAPTERS.map(c=>{const p=chapterProgress(c);
  return `<button class="chap${c===CH?' cur':''}" data-id="${c.id}"><span class="cn" style="background:${c.color}">${c.n}</span><span class="ci"><b>${c.title}</b><small>${c.place||''}</small></span><span class="cp">${p.done?'끝':p.got+'/'+c.words}</span></button>`}).join('');
 $('chList').querySelectorAll('.chap').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;$('chPanel').hidden=true;if(id!==CH.id){boot(id);sfx('door')}}));
 $('chPanel').hidden=false;$('chList').querySelector('.cur')?.focus();
}
$('chBtn').addEventListener('click',openChapters);
$('chPanel').addEventListener('click',e=>{if(e.target.id==='chPanel')$('chPanel').hidden=true});
$('chClose').addEventListener('click',()=>$('chPanel').hidden=true);

/* ---------- start ---------- */
function start(){
 if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
 updateSound();updateRead();
 const want=new URLSearchParams(location.search).get('ch')||store.get(KEY('chapter'));
 boot(CHAPTERS.some(c=>c.id===want)?want:CHAPTERS[0].id); // first visit starts at chapter 1; after that, the last chapter played
 requestAnimationFrame(loop);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
